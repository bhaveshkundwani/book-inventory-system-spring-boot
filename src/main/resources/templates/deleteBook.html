<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

	<meta charset="UTF-8">

	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>Delete Book</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.css">

	<link rel="stylesheet" th:href="@{/css/style.css}">

</head>

<body>

	<!-- ================= NAVBAR ================= -->

	<nav class="navbar navbar-expand-lg navbar-dark bg-success">

		<div class="container">

			<a class="navbar-brand" th:href="@{/}">

				<i class="fa fa-book"></i>
				Book Inventory

			</a>

			<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">

				<span class="navbar-toggler-icon"></span>

			</button>

			<div class="collapse navbar-collapse" id="mainNavbar">

				<ul class="navbar-nav ms-auto">

					<li class="nav-item">
						<a class="nav-link" th:href="@{/}">

							<i class="fa fa-home"></i>
							Home

						</a>
					</li>

					<li class="nav-item">
						<a class="nav-link" th:href="@{/addBook}">

							<i class="fa fa-plus"></i>
							Add Book

						</a>
					</li>

					<li class="nav-item">
						<a class="nav-link" th:href="@{/search}">

							<i class="fa fa-search"></i>
							Search Book

						</a>
					</li>

					<li class="nav-item">
						<a class="nav-link active" th:href="@{/deleteBook}">

							<i class="fa fa-trash"></i>
							Delete Book

						</a>
					</li>

					<li class="nav-item">
						<a class="nav-link" th:href="@{/info}">

							<i class="fa fa-info-circle"></i>
							Book Info

						</a>
					</li>

				</ul>

			</div>

		</div>

	</nav>


	<!-- ================= DELETE BOOK ================= -->

	<main class="container">

		<div class="delete-container">

			<h2 class="page-title text-danger">

				<i class="fa fa-trash"></i>
				Delete Book

			</h2>


			<div class="alert alert-warning">

				<i class="fa fa-exclamation-triangle"></i>

				Enter the Book ID of the book you want to delete.

			</div>


			<form th:action="@{/deleteBook}" th:object="${book}" method="post" onsubmit="return confirmDelete();">

				<div class="mb-3">

					<label for="bookid">
						Book ID
					</label>

					<input type="text" id="bookid" th:field="*{bookid}" class="form-control" placeholder="Enter Book ID"
						required>

				</div>


				<button type="submit" class="btn btn-danger">

					<i class="fa fa-trash"></i>
					Delete Book

				</button>

				<a th:href="@{/}" class="btn btn-secondary">

					Cancel

				</a>

			</form>


			<!-- SUCCESS -->

			<div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show mt-4">

				<i class="fa fa-check-circle"></i>

				<span th:text="${successMessage}">
					Book deleted successfully.
				</span>

				<button type="button" class="btn-close" data-bs-dismiss="alert">
				</button>

			</div>


			<!-- ERROR -->

			<div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show mt-4">

				<i class="fa fa-exclamation-circle"></i>

				<span th:text="${errorMessage}">
					Book not found.
				</span>

				<button type="button" class="btn-close" data-bs-dismiss="alert">
				</button>

			</div>

		</div>

	</main>


	<script>

		function confirmDelete() {

			return confirm(
				"Are you sure you want to delete this book?"
			);

		}

	</script>


	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js">
	</script>

</body>

</html>
